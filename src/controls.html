<!doctype html><html lang="zh-Hant"><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"><title>OpenCodex 設定</title><style>
*{box-sizing:border-box}body{margin:0;padding:32px;background:#171717;color:#eee;font:15px -apple-system,BlinkMacSystemFont,sans-serif}h1{font-size:28px;margin:0 0 8px}.sub{color:#aaa;margin-bottom:24px}section{background:#222;border:1px solid #393939;border-radius:14px;padding:18px;margin:14px 0}label{display:block;margin:10px 0 5px}button,select,input{background:#303030;color:white;border:1px solid #505050;border-radius:8px;padding:10px;font:inherit}button{cursor:pointer;margin:8px 6px 0 0}button.primary{background:#eee;color:#151515}input,select{width:100%}pre{white-space:pre-wrap;line-height:1.6;font:13px -apple-system}#api{display:none}.hint{color:#aaa;font-size:12px;line-height:1.5}#error{color:#ffb9a9}.bucket{margin-top:16px}.quota-row{margin-top:10px}progress{width:100%;height:7px;accent-color:#63d4ac}#quota-state[data-stale=true]{color:#e8c18b}#account{font-weight:600;overflow-wrap:anywhere}</style>
<h1>OpenCodex</h1><div class="sub">原生對話介面 · AgentBridge 連線與工具</div>
<section><div id="state">正在讀取連線狀態…</div><button id="manager">SSH 連線設定</button><button id="reconnect">重新連線</button><p class="hint">管理主機、Mac 工作目錄、最高權限與已記住的工具授權。</p></section>
<section aria-label="帳號與剩餘額度"><div id="source" class="hint"></div><p id="account">尚未取得帳號</p><div id="quota-state" role="status">正在讀取額度…</div><div id="buckets"></div><p id="updated" class="hint"></p><button id="refresh">立即更新額度</button><p class="hint">顯示 Codex 回傳的使用窗口百分比；同帳號其他裝置的使用也會影響額度。不是可用 token 數或 API 金額。</p></section><section><label for="mode">執行模式</label><select id="mode"><option value="ssh">SSH／AgentBridge · 遠端 Runtime／本機工具</option><option value="official">官方登入 · 自己的 ChatGPT 帳號</option><option value="custom">自訂 API · Responses 相容服務</option></select>
<div id="api"><label for="url">API Base URL</label><input id="url" placeholder="https://api.example.com/v1"><label for="model">模型名稱</label><input id="model" placeholder="服務商提供的模型 ID"><label for="key">API Key</label><input id="key" type="password" autocomplete="off" placeholder="儲存在 OpenCodex 的加密設定"></div>
<button class="primary" id="apply">套用並重新啟動</button><p class="hint">官方與 API 模式在本機執行 Codex。AgentBridge 模式維持遠端推理與本機執行架構。切換前請停止目前工作。</p></section><div id="error" role="alert"></div><script src="./controls.js"></script></html>
